services:
  solar-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar-lms-app
    restart: unless-stopped
    ports:
      - "5142:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=solar-db;Port=5432;Database=solar_development;Username=solar;Password=solar_secret;
      - ConnectionStrings__Redis=solar-redis:6379
      - BigBlueButton__ServerUrl=https://bbb.virtual.ufc.br/bigbluebutton
      - BigBlueButton__SharedSecret=solar_bbb_secret
    depends_on:
      solar-db:
        condition: service_healthy
      solar-redis:
        condition: service_started
    networks:
      - solar-net

  solar-db:
    image: postgres:16-alpine
    container_name: solar-lms-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=solar_development
      - POSTGRES_USER=solar
      - POSTGRES_PASSWORD=solar_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar_development"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - solar-net

  solar-redis:
    image: redis:7-alpine
    container_name: solar-lms-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - solar-net

networks:
  solar-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
