services:
  solar-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar-lms-app
    restart: unless-stopped
    ports:
      - "${PORT:-5142}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=solar-db;Port=5432;Database=${POSTGRES_DB:-solar_development};Username=${POSTGRES_USER:-solar};Password=${POSTGRES_PASSWORD:-solar_secret};
      - ConnectionStrings__Redis=solar-redis:6379
      - BigBlueButton__ServerUrl=${BigBlueButton__ServerUrl:-https://bbb.virtual.ufc.br/bigbluebutton}
      - BigBlueButton__SharedSecret=${BigBlueButton__SharedSecret:-solar_bbb_secret}
      - SEQ_SERVER_URL=http://solar-seq:5341
    depends_on:
      solar-db:
        condition: service_healthy
      solar-redis:
        condition: service_started
    networks:
      - solar-net

  solar-db:
    image: postgres:16-alpine
    container_name: solar-lms-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-solar_development}
      - POSTGRES_USER=${POSTGRES_USER:-solar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-solar_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solar} -d ${POSTGRES_DB:-solar_development}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - solar-net

  solar-redis:
    image: redis:7-alpine
    container_name: solar-lms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - solar-net

  solar-seq:
    image: datalust/seq:latest
    container_name: solar-lms-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    networks:
      - solar-net

networks:
  solar-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  seq-data:
