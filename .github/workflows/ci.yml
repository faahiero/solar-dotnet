name: CI/CD Pipeline - Solar LMS (.NET 10 & React 19)

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**', 'hotfix/**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Solar.Client/package-lock.json

      - name: Install NPM Dependencies & Build React Client
        run: |
          cd src/Solar.Client
          npm ci
          npm run build

      - name: Restore NuGet Packages
        run: dotnet restore Solar.sln

      - name: Build Solution (.NET 10)
        run: dotnet build Solar.sln --configuration Release --no-restore

      - name: Run Test Suite with Code Coverage
        run: |
          dotnet test Solar.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage"

      - name: Security Vulnerability Scan (NuGet)
        run: dotnet list Solar.sln package --vulnerable --include-transitive
